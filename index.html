<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Proletix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera con logo y proyecto · franja de cifras · pestañas (plano 2D con catálogo lateral, compras comparadas, reforma, contactos) */
:root{
  --bg:#FCF4F0; --surface:#FFFBF9; --sunk:#F7E4EC; --ink:#6D0101; --muted:#8E4B47; --line:#EED8D6;
  --red:#F86C2F; --red-ink:#5A0101; --gold:#C0D6FF; --gold-ink:#5A0101;
  --ok:#2E7A4E; --warn:#9E5600; --bad:#B0201A;
  --floor:#FFFBF9; --wall:#6D0101; --grid:rgb(109 1 1 / .07);
  --f0:#C0D6FF; --f1:#FDBE9E; --f2:#FFD5FB; --f3:#EBCBC6; --f4:#F5E3D8; --f5:#ECE2E6;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E0606; --surface:#2A0B0B; --sunk:#3A1414; --ink:#FCF4F0; --muted:#D7A6A3; --line:#4D1E1E;
  --red:#F86C2F; --red-ink:#1E0606; --gold:#C0D6FF; --gold-ink:#1E0606;
  --ok:#7CC79A; --warn:#F2B45A; --bad:#FF8A80;
  --floor:#2E1010; --wall:#FCF4F0; --grid:rgb(252 244 240 / .07);
  --f0:#2B3A5C; --f1:#5C2A14; --f2:#4F2A4C; --f3:#4A2222; --f4:#42302A; --f5:#3A2C30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E0606; --surface:#2A0B0B; --sunk:#3A1414; --ink:#FCF4F0; --muted:#D7A6A3; --line:#4D1E1E;
  --red:#F86C2F; --red-ink:#1E0606; --gold:#C0D6FF; --gold-ink:#1E0606;
  --ok:#7CC79A; --warn:#F2B45A; --bad:#FF8A80;
  --floor:#2E1010; --wall:#FCF4F0; --grid:rgb(252 244 240 / .07);
  --f0:#2B3A5C; --f1:#5C2A14; --f2:#4F2A4C; --f3:#4A2222; --f4:#42302A; --f5:#3A2C30; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-stretch:80%;font-weight:800;letter-spacing:.005em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a{color:inherit}

/* Cabecera */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;color:var(--red);flex:none}
.wordmark{font-family:var(--f-display);font-weight:900;font-stretch:115%;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.wordmark small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);font-stretch:100%;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mode{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.mode::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--m,var(--muted))}

.proj{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;border-top:3px solid var(--ink);padding-top:12px}
.proj-pick{display:flex;flex-direction:column;gap:2px;min-width:0}
.proj-pick select,.proj-pick h1{font-family:var(--f-display);font-size:34px;font-weight:800;font-stretch:80%;line-height:1.05}
.proj-pick select{background:transparent;border:0;padding:0 28px 0 0;appearance:none;cursor:pointer;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 12px) 55%,calc(100% - 6px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.kind{display:inline-flex;gap:6px;align-items:center}
.kind b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:3px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);color:var(--red-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(.94)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Cifras */
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.fig{padding:12px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.fig+.fig{border-left:1px solid var(--line)}
.fig .v{font-family:var(--f-display);font-size:28px;font-weight:800;font-stretch:85%;line-height:1.05;font-variant-numeric:tabular-nums}
.fig .s{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar i.over{background:var(--bad)}
.bar u{position:absolute;inset:0 auto 0 0;background:var(--gold)}
@media (max-width:760px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}.fig:nth-child(3){border-left:0}.fig:nth-child(n+3){border-top:1px solid var(--line)}}

/* Pestañas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;font-family:var(--f-display);font-size:18px;font-weight:700;font-stretch:85%;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tab .n{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0 12px}

/* Plano */
.rooms{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.room-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:baseline}
.room-chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.room-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.room-chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.planner{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:900px){.planner{grid-template-columns:minmax(0,1fr)}}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;position:relative;min-width:0}
.canvas svg{display:block;width:100%;height:auto;max-height:72vh;touch-action:none;user-select:none}
.canvas .hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.canvas .warn{position:absolute;right:12px;top:10px;font-size:12px;font-weight:600;color:var(--bad);background:var(--surface);padding:2px 8px;border-radius:4px;border:1px solid var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;font-family:var(--f-display);font-weight:800;font-stretch:90%;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#view3d{position:relative;border-radius:4px;overflow:hidden;min-height:200px}
#view3d canvas{width:100%!important;cursor:grab}
.tb-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
svg .it{cursor:grab}
svg .it.drag{cursor:grabbing}
svg text{font-family:var(--f-body);fill:var(--ink);pointer-events:none}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:18px}
.cat{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto;margin:0 -4px;padding:0 4px}
.cat-g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 0 2px}
.cat button{display:flex;justify-content:space-between;gap:8px;background:none;border:0;padding:6px 8px;border-radius:4px;cursor:pointer;text-align:left;width:100%}
.cat button:hover{background:var(--sunk)}
.cat button span:last-child{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.cat button.prod span:first-child::before{content:"★ ";color:var(--gold)}
.props{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.props .full{grid-column:span 2}
.swatches{display:flex;gap:6px}
.swatches button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}

/* Compras */
.need{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.need-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.need-h h3{font-size:22px}
.need-h .sum{font-size:13px;color:var(--muted)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.prod.elegido{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.prod.comprado{background:var(--sunk)}
.prod .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prod h4{margin:0;font-size:16px;font-weight:600;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.prod .price{font-family:var(--f-display);font-size:26px;font-weight:800;font-stretch:85%;font-variant-numeric:tabular-nums;line-height:1}
.prod .shop{font-size:13px;color:var(--muted)}
.prod .dims{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.prod .note{font-size:13px;overflow-wrap:anywhere}
.prod .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.stars i{color:var(--line);font-style:normal}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.tag.cheap{background:var(--ok);color:var(--surface)}
.proj{border-top-color:var(--red)!important}
.st{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--surface)}
.st-favorito{border-color:var(--red);color:var(--red)}
.st-elegido{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.st-comprado{background:var(--ok);color:var(--surface);border-color:transparent}

/* Reforma */
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.task:hover{border-color:var(--muted)}
.task .t{font-weight:600}
.task .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.task .late{color:var(--bad);font-weight:600}
.task .right{text-align:right;font-size:13px}
.task.hecha .t{text-decoration:line-through;color:var(--muted)}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;cursor:pointer;background:var(--surface)}
.tick.curso{border-color:var(--gold);background:linear-gradient(90deg,var(--gold) 50%,transparent 50%)}
.tick.hecha{border-color:var(--ok);background:var(--ok);color:var(--surface)}

/* Contactos */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.person .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.person h3{font-size:19px}
.person .tel{font-family:var(--f-mono);font-size:14px;user-select:all;overflow-wrap:anywhere}

.blank{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.blank h2{font-size:24px}
.blank p{margin:0;color:var(--muted);max-width:62ch}

/* Diálogos */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgb(40 2 2 / .55)}
dialog form{display:flex;flex-direction:column}
.dlg-h{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dlg-h h2{font-size:24px}
.dlg-b{padding:8px 20px 16px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.dlg-f{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dlg-f .right{display:flex;gap:8px;margin-left:auto}
.field{display:flex;flex-direction:column;gap:4px;grid-column:span 6;min-width:0}
.field.h3{grid-column:span 3}.field.h2{grid-column:span 2}
@media (max-width:480px){.field.h3,.field.h2{grid-column:span 6}}
.field label,.props label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea,.props input,.props select{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
.props>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 64 64">
    <!-- Rodillo de pintar en el lugar de la hoz: mango abajo a la izquierda, armazón curvo y rodillo arriba a la derecha -->
    <g transform="rotate(45 32 32)" fill="currentColor">
      <rect x="17" y="5" width="28" height="11" rx="3"/>
      <path d="M45 10.5h3.5a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H34.6v8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="31.5" y="31" width="6.2" height="26" rx="3"/>
    </g>
    <!-- Martillo -->
    <g transform="rotate(-45 32 32)" fill="currentColor">
      <path d="M17 9h24l5 4v6H17z"/>
      <rect x="28.8" y="18" width="6.4" height="41" rx="3"/>
    </g>
  </symbol>
</svg>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg role="img" aria-label="Logo de Proletix"><use href="#logo"/></svg>
      <div class="wordmark">Proletix<small>Casa, reformas y compras</small></div></div>
    <div class="actions">
      <span class="mode" id="mode">Conectando…</span>
      <button class="btn" id="btnNewProj" type="button">Nuevo proyecto</button>
    </div>
  </header>
  <main id="main" style="display:flex;flex-direction:column;gap:18px"></main>
</div>

<!-- Proyecto -->
<dialog id="dlgProj"><form method="dialog" id="fProj">
  <div class="dlg-h"><h2 id="dlgProjT">Nuevo proyecto</h2><button class="btn ghost sm" value="cancel" formnovalidate>Cerrar</button></div>
  <div class="dlg-b">
    <div class="field"><label for="j_nombre">Nombre</label><input id="j_nombre" required placeholder="Piso de la calle Mayor"></div>
    <div class="field h3"><label for="j_tipo">Tipo</label><select id="j_tipo"><option value="casa">Casa entera</option><option value="estancia">Una estancia</option></select></div>
    <div class="field h3"><label for="j_pres">Presupuesto (€)</label><input id="j_pres" type="number" min="0" step="1" inputmode="decimal"></div>
    <div class="field"><label for="j_dir">Dirección</label><input id="j_dir" placeholder="Opcional"></div>
    <div class="field"><label for="j_notas">Notas</label><textarea id="j_notas"></textarea></div>
  </div>
  <div class="dlg-f"><button class="btn danger" type="button" id="j_del" hidden>Eliminar proyecto</button>
    <div class="right"><button class="btn primary" value="ok">Guardar</button></div></div>
</form></dialog>

<!-- Estancia -->
<dialog id="dlgRoom"><form method="dialog" id="fRoom">
  <div class="dlg-h"><h2 id="dlgRoomT">Nueva estancia</h2><button class="btn ghost sm" value="cancel" formnovalidate>Cerrar</button></div>
  <div class="dlg-b">
    <div class="field"><label for="r_nombre">Nombre</label><input id="r_nombre" required placeholder="Salón" list="roomNames"></div>
    <div class="field h2"><label for="r_ancho">Ancho (cm)</label><input id="r_ancho" type="number" min="50" max="3000" step="1" required inputmode="numeric"></div>
    <div class="field h2"><label for="r_largo">Largo (cm)</label><input id="r_largo" type="number" min="50" max="3000" step="1" required inputmode="numeric"></div>
    <div class="field h2"><label for="r_alto">Techo (cm)</label><input id="r_alto" type="number" min="180" max="600" step="1" inputmode="numeric" placeholder="250"></div>
    <p class="field hint" style="margin:0">Mide de pared a pared por dentro. Las puertas y ventanas las colocas luego desde el catálogo.</p>
  </div>
  <div class="dlg-f"><button class="btn danger" type="button" id="r_del" hidden>Eliminar estancia</button>
    <div class="right"><button class="btn primary" value="ok">Guardar</button></div></div>
</form></dialog>
<datalist id="roomNames"><option>Salón</option><option>Cocina</option><option>Dormitorio principal</option><option>Dormitorio</option><option>Baño</option><option>Aseo</option><option>Recibidor</option><option>Despacho</option><option>Terraza</option></datalist>

<!-- Producto -->
<dialog id="dlgProd"><form method="dialog" id="fProd">
  <div class="dlg-h"><h2 id="dlgProdT">Nuevo producto</h2><button class="btn ghost sm" value="cancel" formnovalidate>Cerrar</button></div>
  <div class="dlg-b">
    <div class="field"><label for="d_busco">¿Qué buscas?</label><input id="d_busco" required list="needs" placeholder="Sofá del salón"><span class="hint">Los productos con el mismo nombre aquí se comparan juntos</span></div>
    <div class="field"><label for="d_nombre">Producto</label><input id="d_nombre" required placeholder="Modelo, color, tela…"></div>
    <div class="field h3"><label for="d_tienda">Tienda</label><input id="d_tienda" list="shops"></div>
    <div class="field h3"><label for="d_precio">Precio (€)</label><input id="d_precio" type="number" min="0" step="any" inputmode="decimal"></div>
    <div class="field"><label for="d_url">Enlace</label><input id="d_url" type="url" placeholder="https://"></div>
    <div class="field h2"><label for="d_ancho">Ancho (cm)</label><input id="d_ancho" type="number" min="0" step="any" inputmode="decimal"></div>
    <div class="field h2"><label for="d_fondo">Fondo (cm)</label><input id="d_fondo" type="number" min="0" step="any" inputmode="decimal"></div>
    <div class="field h2"><label for="d_alto">Alto (cm)</label><input id="d_alto" type="number" min="0" step="any" inputmode="decimal"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ---------- Catálogo y constantes ---------- */
const CATALOGO = [
  ["Salón",[["Sofá 3 plazas",210,90,1,0],["Sofá 2 plazas",160,90,1,0],["Chaise longue",280,160,1,0],["Sillón",80,85,1,0],["Mesa de centro",110,60,0,4],["Mueble TV",180,40,1,4],["Estantería",80,30,1,4],["Alfombra",200,140,0,5]]],
  ["Comedor",[["Mesa 6 personas",160,90,0,4],["Mesa redonda",110,110,0,4],["Silla",45,50,1,4],["Aparador",160,45,1,4]]],
  ["Dormitorio",[["Cama 150",160,205,1,3],["Cama 135",145,200,1,3],["Cama 90",100,200,1,3],["Mesita de noche",45,40,1,4],["Armario 2 puertas",100,60,1,4],["Armario 3 puertas",150,60,1,4],["Cómoda",100,48,1,4],["Escritorio",120,60,1,4]]],
  ["Cocina y baño",[["Frigorífico",60,66,1,5],["Módulo bajo 60",60,60,1,5],["Lavadora",60,60,1,5],["Lavavajillas",60,60,1,5],["Isla",180,90,0,5],["Plato de ducha",120,80,0,0],["Bañera",170,70,0,0],["Inodoro",38,65,1,5],["Lavabo con mueble",80,46,1,5]]],
  ["Huecos",[["Puerta 80",80,80,0,-1,"puerta"],["Puerta 70",70,70,0,-1,"puerta"],["Ventana 120",120,12,0,-1,"ventana"],["Balconera 160",160,12,0,-1,"ventana"]]]
];
const ESTADOS_P = [["visto","Visto"],["favorito","Favorito"],["elegido","Elegido"],["comprado","Comprado"],["descartado","Descartado"]];
const ESTADOS_T = [["pendiente","Pendiente"],["curso","En curso"],["hecha","Hecha"]];
const FILLS = ["--f0","--f1","--f2","--f3","--f4","--f5"];

const S = {mode:"loading", db:null, proyectos:[], estancias:[], items:[], productos:[], tareas:[], contactos:[],
  proyId:null, roomId:null, tab:"plano", sel:null, dragging:false};
const COLS = ["proyectos","estancias","items","productos","tareas","contactos"];
const eur = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur2 = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",minimumFractionDigits:0,maximumFractionDigits:2});
const fdate = d => d ? new Date(d+"T00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"}) : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $ = id => document.getElementById(id);
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const daysTo = d => Math.round((new Date(d+"T00:00") - today())/864e5);
const num = v => v===""||v==null ? "" : +v;
const cm = v => (+v).toLocaleString("es-ES");
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "";

function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;t.setAttribute("role","status");document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- Almacenamiento: base de datos de Claude o este navegador ---------- */
async function save(col,id,data){
  const row={...data,id}; const arr=S[col]; const i=arr.findIndex(x=>x.id===id);
  if(i>=0) arr[i]=row; else arr.push(row);
  if(S.mode==="db"){
    try{ const {id:_,...body}=row; await S.db.collection(col).doc(id).set(body); }
    catch(e){ toast(e?.code==="invalid_argument"?"No tienes permiso para editar este proyecto.":"No se ha podido guardar. Prueba otra vez."); throw e; }
  } else { lsSet("proletix:"+col,arr); }
  render();
}
async function remove(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(S.mode==="db"){ try{ await S.db.collection(col).doc(id).delete(); }catch(e){ toast("No se ha podido eliminar."); throw e; } }
  else lsSet("proletix:"+col,S[col]);
  render();
}
async function boot(){
  render();
  let db=null;
  try{ db = window.claude?.use ? await window.claude.use("db") : null; }catch{ db=null; }
  if(db){
    S.db=db; S.mode="db";
    COLS.forEach(col=>db.collection(col).onSnapshot(snap=>{
      S[col]=snap.docs.map(d=>({...d.data(),id:d.id})); render();
    },()=>toast("Se ha perdido la conexión con los datos. Recarga la página.")));
  } else {
    S.mode="local"; COLS.forEach(col=>S[col]=lsGet("proletix:"+col,[])); render();
  }
}

/* ---------- Selección actual ---------- */
function proyecto(){
  if(!S.proyectos.length) return null;
  const want=S.proyId||lsGet("proletix:proy",null);
  return S.proyectos.find(p=>p.id===want)||[...S.proyectos].sort((a,b)=>(b.creado||0)-(a.creado||0))[0];
}
const roomsOf = pid => S.estancias.filter(e=>e.proyectoId===pid).sort((a,b)=>(a.creado||0)-(b.creado||0));
function room(p){ const rs=roomsOf(p.id); return rs.find(r=>r.id===S.roomId)||rs[0]||null; }
const roomName = id => S.estancias.find(e=>e.id===id)?.nombre||"";

/* ---------- Render ---------- */
function render(){
  if(S.dragging) return;
  const m=$("mode");
  m.textContent = S.mode==="db"?"Guardado en la nube":S.mode==="local"?"Guardado en este navegador":"Conectando…";
  m.style.setProperty("--m",S.mode==="db"?"var(--ok)":S.mode==="local"?"var(--warn)":"var(--muted)");
  const main=$("main");
  // conserva lo que se está escribiendo si llega una actualización
  const ae=document.activeElement, keep=ae&&ae.id&&main.contains(ae)?{id:ae.id,v:ae.value,s:ae.selectionStart}:null;

  if(S.mode==="loading"){ main.innerHTML=`<p class="muted">Cargando tus proyectos…</p>`; return; }
  const p=proyecto(); S.proyId=p?.id||null;
  if(!p){
    main.innerHTML=`<section class="blank"><h2>Crea tu primer proyecto</h2>
      <p>Un proyecto puede ser una casa entera o una sola estancia. Dentro dibujas cada estancia con sus medidas, colocas muebles, guardas los productos que vas viendo para compararlos y llevas las tareas de la reforma con sus plazos.</p>
      <button class="btn primary" type="button" data-act="newProj">Crear proyecto</button></section>`;
    return;
  }
  const r=room(p); S.roomId=r?.id||null;
  const prods=S.productos.filter(x=>x.proyectoId===p.id), tasks=S.tareas.filter(x=>x.proyectoId===p.id);
  const sorted=[...S.proyectos].sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"","es"));
  main.innerHTML=`
    <section class="proj">
      <div class="proj-pick">
        <span class="kind"><b>${p.tipo==="estancia"?"Estancia":"Casa"}</b>${p.direccion?`<span class="muted" style="font-size:13px">${esc(p.direccion)}</span>`:""}</span>
        ${S.proyectos.length>1?`<select id="selProj" aria-label="Proyecto">${sorted.map(x=>`<option value="${esc(x.id)}"${x.id===p.id?" selected":""}>${esc(x.nombre)}</option>`).join("")}</select>`:`<h1>${esc(p.nombre)}</h1>`}
      </div>
      <button class="btn" type="button" data-act="editProj">Editar proyecto</button>
    </section>
    ${figuresHTML(p,prods,tasks)}
    <nav class="tabs" role="tablist">${[["plano","Plano",roomsOf(p.id).length],["compras","Compras",prods.filter(x=>x.estado!=="descartado").length],["reforma","Reforma",tasks.filter(t=>t.estado!=="hecha").length],["contactos","Contactos",S.contactos.length]]
      .map(([k,n,c])=>`<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${S.tab===k}">${n}<span class="n">${c}</span></button>`).join("")}</nav>
    <section>${S.tab==="plano"?planHTML(p,r):S.tab==="compras"?shopHTML(p,prods):S.tab==="reforma"?taskHTML(p,tasks):peopleHTML(tasks)}</section>`;
  if(keep){ const el=$(keep.id); if(el){ el.value=keep.v; el.focus(); try{el.setSelectionRange(keep.s,keep.s)}catch{} } }
  if(S.tab==="plano"&&r){ if(S.vista==="3d") mount3d(r); else bindPlan(r); }
}

function figuresHTML(p,prods,tasks){
  const elegidos=prods.filter(x=>x.estado==="elegido"||x.estado==="comprado");
  const comprado=prods.filter(x=>x.estado==="comprado").reduce((s,x)=>s+(+x.precio||0),0);
  const previsto=elegidos.reduce((s,x)=>s+(+x.precio||0),0)+tasks.reduce((s,t)=>s+(+t.real||+t.prev||0),0);
  const gastado=comprado+tasks.reduce((s,t)=>s+(+t.real||0),0);
  const max=+p.presupuesto||0, ref=max||previsto;
  const needs=[...new Set(prods.filter(x=>x.estado!=="descartado").map(x=>x.busco))];
  const resueltas=needs.filter(n=>prods.some(x=>x.busco===n&&(x.estado==="elegido"||x.estado==="comprado"))).length;
  const next=tasks.filter(t=>t.estado!=="hecha"&&t.fin).sort((a,b)=>a.fin.localeCompare(b.fin))[0];
  const nd=next?daysTo(next.fin):null;
  return `<section class="figures" aria-label="Resumen">
    <div class="fig"><span class="label">Previsto</span><span class="v">${eur.format(previsto)}</span>
      <span class="s">${max?(previsto<=max?`Te quedan ${eur.format(max-previsto)} de ${eur.format(max)}`:`<span style="color:var(--bad)">Te pasas ${eur.format(previsto-max)}</span>`):"Sin presupuesto máximo"}</span></div>
    <div class="fig"><span class="label">Gastado</span><span class="v">${eur.format(gastado)}</span>
      <div class="bar"><i class="${ref&&gastado>ref?"over":""}" style="width:${ref?Math.min(100,gastado/ref*100):0}%"></i></div><span class="s">${max?"sobre el presupuesto":"sobre lo previsto"}</span></div>
    <div class="fig"><span class="label">Compras decididas</span><span class="v">${resueltas} / ${needs.length}</span>
      <div class="bar"><u style="width:${needs.length?resueltas/needs.length*100:0}%"></u></div><span class="s">cosas que buscas con producto elegido</span></div>
    <div class="fig"><span class="label">Próximo plazo</span><span class="v" style="${nd!==null&&nd<0?"color:var(--bad)":""}">${next?(nd<0?`${-nd} d tarde`:nd===0?"Hoy":`${nd} días`):"—"}</span>
      <span class="s">${next?esc(next.titulo):"Sin tareas con fecha"}</span></div>
  </section>`;
}

/* ---------- Plano ---------- */
function footprint(it){ const r=(it.rot||0)%180!==0; return {fw:r?it.d:it.w, fd:r?it.w:it.d}; }
function problems(items,rm){
  const bad=new Set();
  items.forEach(a=>{
    const A=footprint(a);
    if(a.tipo!=="ventana"&&a.tipo!=="puerta"&&(a.x<0||a.y<0||a.x+A.fw>rm.ancho||a.y+A.fd>rm.largo)) bad.add(a.id);
    if(a.tipo==="ventana"||a.tipo==="alfombra"||/alfombra/i.test(a.nombre)) return;
    items.forEach(b=>{
      if(a===b||b.tipo==="ventana"||/alfombra/i.test(b.nombre)) return;
      const B=footprint(b);
      if(a.x<b.x+B.fw-1&&b.x<a.x+A.fw-1&&a.y<b.y+B.fd-1&&b.y<a.y+A.fd-1) bad.add(a.id);
    });
  });
  return bad;
}
function itemSVG(it,bad){
  const {fw,fd}=footprint(it), sel=S.sel===it.id, rot=it.rot||0;
  const stroke=bad?"var(--bad)":sel?"var(--red)":"var(--ink)", sw=sel?3:1.5, dash=bad?' stroke-dasharray="6 4"':"";
  let body="";
  if(it.tipo==="puerta"){
    const s=it.w;
    body=`<g transform="rotate(${rot} ${s/2} ${s/2})"><rect x="0" y="-11" width="${s}" height="12" fill="var(--floor)"/>
      <rect x="0" y="0" width="${s}" height="${s}" fill="transparent"/>
      <path d="M0 0L0 ${s}A${s} ${s} 0 0 0 ${s} 0" fill="none" stroke="${stroke}" stroke-width="${sw}"${dash}/>
      <line x1="0" y1="0" x2="0" y2="${s}" stroke="${stroke}" stroke-width="4"/></g>`;
  } else if(it.tipo==="ventana"){
    const h=fw>fd;
    body=`<rect x="0" y="0" width="${fw}" height="${fd}" fill="var(--surface)" stroke="${stroke}" stroke-width="${sw}"${dash}/>
      ${h?`<line x1="0" y1="${fd/2}" x2="${fw}" y2="${fd/2}" stroke="${stroke}" stroke-width="1"/>`:`<line x1="${fw/2}" y1="0" x2="${fw/2}" y2="${fd}" stroke="${stroke}" stroke-width="1"/>`}`;
  } else {
    const fill=`var(${FILLS[it.color??0]||"--f0"})`;
    let back="";
    if(it.back){ const t=Math.min(14,Math.min(fw,fd)*.22);
      back=rot===0?`<rect x="0" y="0" width="${fw}" height="${t}"/>`:rot===90?`<rect x="${fw-t}" y="0" width="${t}" height="${fd}"/>`:rot===180?`<rect x="0" y="${fd-t}" width="${fw}" height="${t}"/>`:`<rect x="0" y="0" width="${t}" height="${fd}"/>`;
      back=`<g fill="var(--ink)" opacity=".18">${back}</g>`; }
    const fs=Math.max(9,Math.min(16,Math.min(fw,fd)/4.2));
    const label=Math.min(fw,fd)>=34?`<text x="${fw/2}" y="${fd/2-fs*.15}" font-size="${fs}" text-anchor="middle" font-weight="600">${esc(it.nombre.length>22?it.nombre.slice(0,21)+"…":it.nombre)}</text>
      <text x="${fw/2}" y="${fd/2+fs*1.05}" font-size="${fs*.8}" text-anchor="middle" opacity=".65">${cm(it.w)}×${cm(it.d)}</text>`:"";
    body=`<rect x="0" y="0" width="${fw}" height="${fd}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}/>${back}${label}`;
  }
  return `<g class="it" data-item="${esc(it.id)}" transform="translate(${it.x} ${it.y})"><title>${esc(it.nombre)} · ${cm(it.w)} × ${cm(it.d)} cm</title>${body}</g>`;
}
function planHTML(p,r){
  const rs=roomsOf(p.id);
  const chips=`<div class="rooms">${rs.map(x=>`<button class="room-chip" type="button" data-room="${esc(x.id)}" aria-pressed="${r&&x.id===r.id}">${esc(x.nombre)} <small>${cm(x.ancho)}×${cm(x.largo)}</small></button>`).join("")}
    <button class="btn ghost sm" type="button" data-act="newRoom">+ Estancia</button></div>`;
  if(!r) return `<div class="toolbar">${chips}</div><div class="blank"><h2>Dibuja tu primera estancia</h2><p>Solo necesitas el ancho y el largo en centímetros. Después arrastras muebles encima y ves si caben.</p><button class="btn primary" type="button" data-act="newRoom">Añadir estancia</button></div>`;
  const items=S.items.filter(i=>i.estanciaId===r.id);
  const bad=problems(items,r);
  const W=+r.ancho, L=+r.largo, pad=Math.max(40,Math.max(W,L)*.07);
  const lines=[]; for(let x=50;x<W;x+=50) lines.push(`M${x} 0V${L}`); for(let y=50;y<L;y+=50) lines.push(`M0 ${y}H${W}`);
  const sel=items.find(i=>i.id===S.sel);
  const myProds=S.productos.filter(x=>x.proyectoId===p.id&&+x.ancho>0&&+x.fondo>0&&x.estado!=="descartado");
  const area=(W*L/10000).toLocaleString("es-ES",{maximumFractionDigits:1});
  const v3=S.vista==="3d";
  return `<div class="toolbar">${chips}<div class="tb-right"><div class="seg" role="group" aria-label="Vista"><button type="button" data-vista="2d" aria-pressed="${!v3}">2D</button><button type="button" data-vista="3d" aria-pressed="${v3}">3D</button></div><button class="btn sm" type="button" data-act="editRoom">Medidas de ${esc(r.nombre)}</button></div></div>
  <div class="planner">
    <div class="canvas">
      ${v3?`<div id="view3d"></div><span class="hint">Arrastra un mueble para moverlo · arrastra el fondo para girar · rueda o pellizco para acercar</span>`:`<svg id="plan" viewBox="${-pad} ${-pad} ${W+pad*2} ${L+pad*2}" role="img" aria-label="Plano de ${esc(r.nombre)}">
        <rect x="0" y="0" width="${W}" height="${L}" fill="var(--floor)"/>
        <path d="${lines.join("")}" stroke="var(--grid)" stroke-width="1" fill="none"/>
        <rect x="-6" y="-6" width="${W+12}" height="${L+12}" fill="none" stroke="var(--wall)" stroke-width="12"/>
        <g font-size="${pad*.32}"><text x="${W/2}" y="${-pad*.45}" text-anchor="middle" class="num" opacity=".7">${cm(W)} cm</text>
        <text transform="translate(${-pad*.45} ${L/2}) rotate(-90)" text-anchor="middle" opacity=".7">${cm(L)} cm</text></g>
        <g id="itemsLayer">${[...items].sort((a,b)=>(a.tipo==="alfombra"||/alfombra/i.test(a.nombre)?-1:0)-(b.tipo==="alfombra"||/alfombra/i.test(b.nombre)?-1:0)).map(i=>itemSVG(i,bad.has(i.id))).join("")}</g>
      </svg>
      <span class="hint">${area} m² · cuadrícula de 50 cm · arrastra para mover</span>`}
      ${bad.size?`<span class="warn">${bad.size} ${bad.size>1?"muebles no caben o se solapan":"mueble no cabe o se solapa"}</span>`:""}
    </div>
    <div class="side">
      ${sel?propsHTML(sel):""}
      <div class="panel"><h3>Añadir al plano</h3>
        <div class="cat">
          ${myProds.length?`<div class="cat-g">Mis productos</div>${myProds.map(x=>`<button class="prod" type="button" data-addprod="${esc(x.id)}"><span>${esc(x.nombre)}</span><span>${cm(x.ancho)}×${cm(x.fondo)}</span></button>`).join("")}`:""}

function size3d(){

function place3d(g,it){ const {fw,fd}=footprint(it); g.position.set(it.x+fw/2,0,it.y+fd/2); g.rotation.y=-(it.rot||0)*Math.PI/180; }

  const c=document.createElement("canvas"); c.width=c.height=512; const x=c.getContext("2d");

function onWall(m,side,along,y,W,L,off){

function build3dRoom(r){

            ${url?`<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">Ver en tienda ↗</a>`:""}
            ${+x.ancho>0&&+x.fondo>0?`<button class="btn sm" type="button" data-place="${esc(x.id)}">Colocar en plano</button>`:""}
            ${x.estado!=="elegido"&&x.estado!=="comprado"&&x.estado!=="descartado"?`<button class="btn sm ghost" type="button" data-choose="${esc(x.id)}">Elegir</button>`:""}</div>
        </article>`}).join("")}</div></section>`;
  }).join("");
}

/* ---------- Reforma ---------- */
function taskHTML(p,tasks){
  const head=`<div class="toolbar"><span class="label">Tareas, plazos y quién las hace</span><button class="btn primary" type="button" data-act="newTask">Añadir tarea</button></div>`;
  if(!tasks.length) return head+`<div class="blank"><h2>¿Hay obra?</h2><p>Apunta cada trabajo (pintar el salón, cambiar el plato de ducha…) con su fecha límite, quién lo hace y lo que cuesta. Las que se retrasen se marcan en rojo.</p></div>`;
  const ord={curso:0,pendiente:1,hecha:2};
  const list=[...tasks].sort((a,b)=>(ord[a.estado]??1)-(ord[b.estado]??1)||(a.fin||"9999").localeCompare(b.fin||"9999"));
  return head+`<div class="tasks">${list.map(t=>{
    const c=S.contactos.find(x=>x.id===t.contactoId), late=t.fin&&t.estado!=="hecha"&&daysTo(t.fin)<0;
    return `<div class="task ${t.estado||""}" data-edittask="${esc(t.id)}" role="button" tabindex="0">
      <button class="tick ${t.estado||""}" type="button" data-cycle="${esc(t.id)}" aria-label="Cambiar estado: ${(ESTADOS_T.find(e=>e[0]===t.estado)||ESTADOS_T[0])[1]}">${t.estado==="hecha"?"✓":""}</button>
      <div style="min-width:0"><div class="t">${esc(t.titulo)}</div>
        <div class="sub">${t.estanciaId?`<span>${esc(roomName(t.estanciaId))}</span>`:""}${c?`<span>${esc(c.nombre)}${c.tel?` · <span class="num">${esc(c.tel)}</span>`:""}</span>`:""}${t.fin?`<span class="${late?"late":""}">${late?"Retrasada · ":""}hasta el ${fdate(t.fin)}</span>`:""}</div></div>
      <div class="right num">${t.real?eur.format(+t.real):t.prev?`<span class="muted">${eur.format(+t.prev)} prev.</span>`:""}</div>
    </div>`}).join("")}</div>`;
}

/* ---------- Contactos ---------- */
function peopleHTML(tasks){
  const head=`<div class="toolbar"><span class="label">Compartidos entre todos tus proyectos</span><button class="btn primary" type="button" data-act="newCont">Añadir contacto</button></div>`;
  if(!S.contactos.length) return head+`<div class="blank"><h2>Ten a mano a quién llamar</h2><p>Fontanero, electricista, la tienda del sofá, el montador… Luego los asignas a las tareas de la reforma.</p></div>`;
  return head+`<div class="people">${[...S.contactos].sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"","es")).map(c=>{
    const mine=tasks.filter(t=>t.contactoId===c.id);
    return `<article class="person"><div class="row"><h3>${esc(c.nombre)}</h3><button class="btn ghost sm" type="button" data-editcont="${esc(c.id)}">Editar</button></div>
      <span class="muted" style="font-size:13px">${esc(c.oficio||"")}</span>
      ${c.tel?`<span class="tel">${esc(c.tel)}</span>`:""}${c.email?`<span class="tel" style="font-size:13px">${esc(c.email)}</span>`:""}
      ${c.notas?`<span style="font-size:13px">${esc(c.notas)}</span>`:""}
      ${mine.length?`<span class="muted" style="font-size:13px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px">${mine.length} tarea${mine.length>1?"s":""} en este proyecto</span>`:""}</article>`}).join("")}</div>`;
}

/* ---------- Diálogos ---------- */
function fill(el,opts,val){ el.innerHTML=opts.map(([v,n])=>`<option value="${esc(v)}">${esc(n)}</option>`).join(""); el.value=val??opts[0]?.[0]??""; }
function armDelete(btn,fn){
  btn.dataset.label ||= btn.textContent; btn.textContent=btn.dataset.label; btn.classList.remove("armed");
  btn.onclick=async()=>{ if(!btn.classList.contains("armed")){btn.classList.add("armed");btn.textContent="Pulsa otra vez para eliminar";return;} await fn(); };
}
const roomOpts = pid => [["","Toda la casa"],...roomsOf(pid).map(r=>[r.id,r.nombre])];

let edP=null;
function openProj(p){
  edP=p||null; $("dlgProjT").textContent=p?"Editar proyecto":"Nuevo proyecto";
  $("j_nombre").value=p?.nombre||""; $("j_tipo").value=p?.tipo||"casa"; $("j_pres").value=p?.presupuesto||""; $("j_dir").value=p?.direccion||""; $("j_notas").value=p?.notas||"";
  $("j_del").hidden=!p;
  if(p) armDelete($("j_del"),async()=>{
    const rids=roomsOf(p.id).map(r=>r.id);
    for(const it of S.items.filter(i=>rids.includes(i.estanciaId))) await remove("items",it.id);
    for(const col of ["estancias","productos","tareas"]) for(const x of S[col].filter(x=>x.proyectoId===p.id)) await remove(col,x.id);
    await remove("proyectos",p.id); $("dlgProj").close(); S.proyId=null; lsSet("proletix:proy",null); toast("Proyecto eliminado");
  });
  $("dlgProj").showModal();
}
$("fProj").addEventListener("submit",async ev=>{
  if(ev.submitter?.value!=="ok") return;
  const id=edP?.id||uid();
  const data={nombre:$("j_nombre").value.trim(),tipo:$("j_tipo").value,presupuesto:num($("j_pres").value)||0,direccion:$("j_dir").value.trim(),notas:$("j_notas").value.trim(),creado:edP?.creado||Date.now()};
  try{
    await save("proyectos",id,data); S.proyId=id; lsSet("proletix:proy",id);
    if(!edP){ const rid=uid(); await save("estancias",rid,{proyectoId:id,nombre:data.tipo==="estancia"?data.nombre:"Salón",ancho:400,largo:350,creado:Date.now()}); S.roomId=rid; S.tab="plano"; render(); }
    toast(edP?"Proyecto guardado":"Proyecto creado");
  }catch{}
});

let edR=null;
function openRoom(r){
  edR=r||null; $("dlgRoomT").textContent=r?`Medidas de ${r.nombre}`:"Nueva estancia";
  $("r_nombre").value=r?.nombre||""; $("r_ancho").value=r?.ancho||""; $("r_largo").value=r?.largo||""; $("r_alto").value=r?.alto||"";
  $("r_del").hidden=!r;
  if(r) armDelete($("r_del"),async()=>{
    for(const it of S.items.filter(i=>i.estanciaId===r.id)) await remove("items",it.id);
    await remove("estancias",r.id); $("dlgRoom").close(); S.roomId=null; toast("Estancia eliminada"); render();
  });
  $("dlgRoom").showModal();
}
$("fRoom").addEventListener("submit",async ev=>{
  if(ev.submitter?.value!=="ok") return;
  const id=edR?.id||uid();
  try{ await save("estancias",id,{proyectoId:edR?.proyectoId||S.proyId,nombre:$("r_nombre").value.trim(),ancho:+$("r_ancho").value,largo:+$("r_largo").value,alto:+$("r_alto").value||250,creado:edR?.creado||Date.now()});
    S.roomId=id; render(); toast(edR?"Medidas guardadas":"Estancia añadida"); }catch{}
});

let edD=null;
function openProd(x,preset={}){
  edD=x||null; $("dlgProdT").textContent=x?"Editar producto":"Guardar producto";
  const pid=x?.proyectoId||S.proyId;
  $("needs").innerHTML=[...new Set(S.productos.filter(y=>y.proyectoId===pid).map(y=>y.busco))].map(n=>`<option value="${esc(n)}">`).join("");
  $("shops").innerHTML=[...new Set(S.productos.map(y=>y.tienda).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join("");
  fill($("d_estado"),ESTADOS_P,x?.estado||"visto"); fill($("d_room"),roomOpts(pid),x?.estanciaId??preset.estanciaId??"");
  $("d_busco").value=x?.busco||preset.busco||""; $("d_nombre").value=x?.nombre||""; $("d_tienda").value=x?.tienda||""; $("d_precio").value=x?.precio??"";
  $("d_url").value=x?.url||""; $("d_ancho").value=x?.ancho??""; $("d_fondo").value=x?.fondo??""; $("d_alto").value=x?.alto??"";
  $("d_valor").value=String(x?.valor||0); $("d_nota").value=x?.nota||"";
  $("d_del").hidden=!x;
  if(x) armDelete($("d_del"),async()=>{ for(const it of S.items.filter(i=>i.productoId===x.id)) await remove("items",it.id); await remove("productos",x.id); $("dlgProd").close(); toast("Producto eliminado"); });
  $("dlgProd").showModal();
}
$("fProd").addEventListener("submit",async ev=>{
  if(ev.submitter?.value!=="ok") return;
  const id=edD?.id||uid();
  const data={proyectoId:edD?.proyectoId||S.proyId,busco:$("d_busco").value.trim(),nombre:$("d_nombre").value.trim(),tienda:$("d_tienda").value.trim(),precio:num($("d_precio").value),
    url:$("d_url").value.trim(),ancho:num($("d_ancho").value),fondo:num($("d_fondo").value),alto:num($("d_alto").value),estado:$("d_estado").value,valor:+$("d_valor").value,
    estanciaId:$("d_room").value,nota:$("d_nota").value.trim(),creado:edD?.creado||Date.now()};
  try{
    await save("productos",id,data);
    // si el producto está en el plano, actualiza su tamaño
    for(const it of S.items.filter(i=>i.productoId===id)) if(+data.ancho>0&&+data.fondo>0&&(it.w!==+data.ancho||it.d!==+data.fondo||it.nombre!==data.nombre)){ const {id:iid,...b}=it; await save("items",iid,{...b,w:+data.ancho,d:+data.fondo,nombre:data.nombre}); }
    toast(edD?"Producto guardado":"Producto guardado en «"+data.busco+"»");
  }catch{}
});

let edT=null;
function openTask(t){
  edT=t||null; $("dlgTaskT").textContent=t?"Editar tarea":"Nueva tarea";
  const pid=t?.proyectoId||S.proyId;
  fill($("t_room"),roomOpts(pid),t?.estanciaId||""); fill($("t_estado"),ESTADOS_T,t?.estado||"pendiente");
  fill($("t_cont"),[["","Sin asignar"],...[...S.contactos].sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"","es")).map(c=>[c.id,`${c.nombre}${c.oficio?" · "+c.oficio:""}`])],t?.contactoId||"");
  $("t_titulo").value=t?.titulo||""; $("t_ini").value=t?.inicio||""; $("t_fin").value=t?.fin||""; $("t_prev").value=t?.prev??""; $("t_real").value=t?.real??""; $("t_notas").value=t?.notas||"";
  $("t_del").hidden=!t;
  if(t) armDelete($("t_del"),async()=>{ await remove("tareas",t.id); $("dlgTask").close(); toast("Tarea eliminada"); });
  $("dlgTask").showModal();
}
$("fTask").addEventListener("submit",async ev=>{
  if(ev.submitter?.value!=="ok") return;
  const id=edT?.id||uid();
  try{ await save("tareas",id,{proyectoId:edT?.proyectoId||S.proyId,titulo:$("t_titulo").value.trim(),estanciaId:$("t_room").value,estado:$("t_estado").value,contactoId:$("t_cont").value,
    inicio:$("t_ini").value,fin:$("t_fin").value,prev:num($("t_prev").value),real:num($("t_real").value),notas:$("t_notas").value.trim(),creado:edT?.creado||Date.now()});
    toast(edT?"Tarea guardada":"Tarea añadida"); }catch{}
});

let edC=null;
function openCont(c){
  edC=c||null; $("dlgContT").textContent=c?"Editar contacto":"Nuevo contacto";
  $("c_nombre").value=c?.nombre||""; $("c_oficio").value=c?.oficio||""; $("c_tel").value=c?.tel||""; $("c_email").value=c?.email||""; $("c_notas").value=c?.notas||"";
  $("c_del").hidden=!c;
  if(c) armDelete($("c_del"),async()=>{
    for(const t of S.tareas.filter(t=>t.contactoId===c.id)){ const {id,...b}=t; await save("tareas",id,{...b,contactoId:""}); }
    await remove("contactos",c.id); $("dlgCont").close(); toast("Contacto eliminado");
  });
  $("dlgCont").showModal();
}
$("fCont").addEventListener("submit",async ev=>{
  if(ev.submitter?.value!=="ok") return;
  const id=edC?.id||uid();
  try{ await save("contactos",id,{nombre:$("c_nombre").value.trim(),oficio:$("c_oficio").value.trim(),tel:$("c_tel").value.trim(),email:$("c_email").value.trim(),notas:$("c_notas").value.trim()});
    toast(edC?"Contacto guardado":"Contacto añadido"); }catch{}
});

/* ---------- Eventos ---------- */
function selItem(){ return S.items.find(i=>i.id===S.sel); }
function saveItem(it,patch){ const {id,...b}=it; return save("items",id,{...b,...patch}).catch(()=>{}); }
$("btnNewProj").onclick=()=>openProj(null);
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab],[data-room],[data-addgen],[data-addprod],[data-editprod],[data-place],[data-choose],[data-edittask],[data-cycle],[data-editcont],[data-color],[data-vista]");
  if(!t) return;
  const p=proyecto(), r=p&&room(p), d=t.dataset;
  if(d.vista){ S.vista=d.vista; lsSet("proletix:vista",S.vista); render(); return; }
  if(d.tab){ S.tab=d.tab; lsSet("proletix:tab",S.tab); render(); return; }
  if(d.room){ S.roomId=d.room; S.sel=null; render(); return; }
  if(d.addgen){ const [gi,ci]=d.addgen.split(".").map(Number); const c=CATALOGO[gi][1][ci]; addItem(r,{nombre:c[0],w:c[1],d:c[2],back:!!c[3],color:Math.max(0,c[4]),tipo:c[5]||""}); return; }
  if(d.addprod){ const x=S.productos.find(y=>y.id===d.addprod); addItem(r,{nombre:x.nombre,w:+x.ancho,d:+x.fondo,back:true,color:4,productoId:x.id}); return; }
  if(d.place){ const x=S.productos.find(y=>y.id===d.place); const target=S.estancias.find(e=>e.id===x.estanciaId)||r;
    if(!target){ toast("Crea primero una estancia en la pestaña Plano."); return; }
    S.roomId=target.id; S.tab="plano"; addItem(target,{nombre:x.nombre,w:+x.ancho,d:+x.fondo,back:true,color:4,productoId:x.id}); toast(`Colocado en ${target.nombre}. Arrástralo a su sitio.`); return; }
  if(d.choose){ const x=S.productos.find(y=>y.id===d.choose); const {id,...b}=x; save("productos",id,{...b,estado:"elegido"}).catch(()=>{}); return; }
  if(d.editprod){ openProd(S.productos.find(y=>y.id===d.editprod)); return; }
  if(d.cycle){ e.stopPropagation(); const x=S.tareas.find(y=>y.id===d.cycle); const nx={pendiente:"curso",curso:"hecha",hecha:"pendiente"}[x.estado||"pendiente"]; const {id,...b}=x; save("tareas",id,{...b,estado:nx}).catch(()=>{}); return; }
  if(d.edittask){ openTask(S.tareas.find(y=>y.id===d.edittask)); return; }
  if(d.editcont){ openCont(S.contactos.find(y=>y.id===d.editcont)); return; }
  if(d.color){ const it=selItem(); if(it) saveItem(it,{color:+d.color}); return; }
  switch(d.act){
    case "newProj": openProj(null); break;
    case "editProj": openProj(p); break;
    case "newRoom": openRoom(null); break;
    case "editRoom": openRoom(r); break;
    case "newProd": openProd(null,{estanciaId:""}); break;
    case "newTask": openTask(null); break;
    case "newCont": openCont(null); break;
    case "unsel": S.sel=null; render(); break;
    case "rotate": { const it=selItem(); if(it) saveItem(it,{rot:((it.rot||0)+90)%360}); break; }
    case "dup": { const it=selItem(); if(it){ const {id,...b}=it; const nid=uid(); S.sel=nid; save("items",nid,{...b,x:it.x+20,y:it.y+20,creado:Date.now()}).catch(()=>{}); } break; }
    case "delItem": { const it=selItem(); if(it){ S.sel=null; remove("items",it.id).catch(()=>{}); } break; }
  }
});
document.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="selProj"){ S.proyId=e.target.value; S.roomId=null; S.sel=null; lsSet("proletix:proy",S.proyId); render(); return; }
  const it=selItem(); if(!it) return;
  const v=e.target.value;
  if(id==="pr_nombre"&&v.trim()) saveItem(it,{nombre:v.trim()});
  if(id==="pr_w"&&+v>=5) saveItem(it,{w:+v});
  if(id==="pr_d"&&+v>=5) saveItem(it,{d:+v});
  if(id==="pr_h"&&+v>=1) saveItem(it,{h:+v});
  if(id==="pr_x"&&v!=="") saveItem(it,{x:+v});
  if(id==="pr_y"&&v!=="") saveItem(it,{y:+v});
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("[data-edittask]")) openTask(S.tareas.find(y=>y.id===e.target.dataset.edittask));
  if(S.tab==="plano"&&S.sel&&!e.target.closest("input,textarea,select,dialog")){
    const it=selItem(); if(!it) return;
    const step=e.shiftKey?1:5, mv={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];
    if(mv){ e.preventDefault(); saveItem(it,{x:it.x+mv[0],y:it.y+mv[1]}); }
    if(e.key==="r"||e.key==="R") saveItem(it,{rot:((it.rot||0)+90)%360});
    if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); S.sel=null; remove("items",it.id).catch(()=>{}); }
  }
});

S.tab=lsGet("proletix:tab","plano"); S.vista=lsGet("proletix:vista","3d");
boot();
</script>
